<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcard Quiz App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
:root{
  --brand:#057573; --brand-2:#037674; --brand-soft:#e6f1f1; --brand-glow:rgba(5,117,115,.15);
  --bg:#f0f4f8; --card:#ffffff; --text:#1a202c; --muted:#718096; --border:#e2e8f0;
  --danger:#e53e3e; --radius:16px; --radius-lg:24px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(160deg,#1a365d 0%,#2d3748 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.phone{width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;border:2px solid #2d3748;display:flex;flex-direction:column;}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 20px;font-size:14px;font-weight:700;color:#fff;background:var(--brand);}
.status .icons{display:flex;gap:8px;align-items:center;}
.header{background:var(--brand);padding:18px 20px;color:#fff;}
.header h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px;}
.header .sub{font-size:13px;opacity:.85;margin-top:2px;font-weight:500;}
.content{flex:1;padding:16px 20px;overflow-y:auto;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
.card-area{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin:12px 0;min-height:180px;}
.counter{font-size:13px;color:var(--muted);font-weight:700;margin:4px 0 12px;text-transform:uppercase;letter-spacing:.5px;}
.q-text{font-size:20px;font-weight:700;color:var(--text);line-height:1.4;}
.answer{margin-top:16px;padding:14px 16px;background:var(--brand-soft);border-radius:14px;color:var(--brand);font-weight:600;font-size:16px;border-left:4px solid var(--brand);}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--brand-2);transform:translateY(-1px);}
.btn.outline{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
.btn.outline:hover{background:var(--brand-soft);}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin:12px 0;}
.form h3{font-size:16px;font-weight:800;margin-bottom:12px;color:var(--text);}
.form input,.form textarea{width:100%;margin:4px 0 10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;outline:none;transition:.2s;background:#f8fafc;}
.form input:focus,.form textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-glow);}
.form textarea{resize:vertical;min-height:70px;}
.error{color:var(--danger);font-size:13px;font-weight:600;margin:4px 0;}
.hidden{display:none;}
.empty{padding:32px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--card);}
.empty p{color:var(--muted);margin-bottom:16px;font-size:15px;}
.bottomnav{height:70px;background:var(--brand);display:flex;align-items:center;justify-content:space-around;padding:0 4px;}
.bottomnav .bn{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:10px;font-weight:700;cursor:pointer;opacity:.75;transition:.2s;padding:6px 10px;border-radius:10px;}
.bottomnav .bn.active{opacity:1;background:rgba(255,255,255,.15);}
.bottomnav .bn i{width:22px;height:22px;}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><div class="icons"><i data-lucide="wifi" style="width:16px;height:16px;color:#fff;"></i><i data-lucide="battery-full" style="width:20px;height:20px;color:#fff;"></i></div></div>
  <div class="header">
    <h1>Flashcards</h1>
    <div class="sub">Study smarter, one card at a time</div>
  </div>
  <div class="content">
    <div id="empty-state" class="empty hidden">
      <p>No cards yet. Add your first flashcard to get started.</p>
      <button class="btn" onclick="openAdd()"><i data-lucide="plus" style="width:16px;height:16px;"></i> Add Card</button>
    </div>

    <div id="study" class="hidden">
      <div id="card-counter" class="counter">Card 0 of 0</div>
      <div class="card-area">
        <div id="card-question" class="q-text"></div>
        <div id="card-answer" class="answer hidden"></div>
      </div>
      <div class="btn-row">
        <button id="show-answer-btn" class="btn outline" onclick="toggleAnswer()"><i data-lucide="eye" style="width:16px;height:16px;"></i> Show Answer</button>
        <button id="prev-btn" class="btn ghost" onclick="prevCard()"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Previous</button>
        <button id="next-btn" class="btn ghost" onclick="nextCard()">Next <i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
        <button id="edit-btn" class="btn ghost" onclick="openEdit()"><i data-lucide="pencil" style="width:16px;height:16px;"></i> Edit</button>
        <button id="delete-btn" class="btn ghost" onclick="deleteCard()"><i data-lucide="trash-2" style="width:16px;height:16px;"></i> Delete</button>
        <button id="add-btn" class="btn" onclick="openAdd()"><i data-lucide="plus" style="width:16px;height:16px;"></i> Add Card</button>
      </div>
    </div>

    <div id="form" class="hidden">
      <div class="form">
        <h3 id="form-title">Add Card</h3>
        <input id="question-input" placeholder="Question (front of card)" />
        <textarea id="answer-input" placeholder="Answer (back of card)"></textarea>
        <div id="error-message" class="error hidden"></div>
        <div class="btn-row">
          <button id="save-btn" class="btn" onclick="saveCard()"><i data-lucide="check" style="width:16px;height:16px;"></i> Save</button>
          <button id="cancel-btn" class="btn ghost" onclick="cancelForm()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <div class="bottomnav">
    <div class="bn active"><i data-lucide="home"></i><span>Home</span></div>
    <div class="bn"><i data-lucide="layers"></i><span>Cards</span></div>
    <div class="bn"><i data-lucide="plus-circle"></i><span>Add</span></div>
    <div class="bn"><i data-lucide="user"></i><span>Profile</span></div>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
