<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcard Quiz App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{
  --brand:#057573; --brand-dark:#045a58; --brand-soft:#e6f1f1; --brand-border:#b8d4d3;
  --bg:#ebe9e9; --surface:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --danger:#dc2626; --danger-soft:#fef2f2;
  --radius-btn:14px; --radius-card:20px; --radius-input:12px; --radius-sheet:22px; --radius-icon:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font-family:inherit;}

.app{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
@media (min-width:481px){ .app{border:1px solid var(--brand-border);border-radius:16px;overflow:hidden;min-height:100dvh;} }

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;}
.topbar-left{display:flex;flex-direction:column;}
.topbar .label{font-size:12px;color:var(--text-muted);font-weight:500;}
.topbar .title{font-size:20px;font-weight:600;color:var(--text);}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-icon);background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.icon-btn:hover{transform:scale(.97);}
.icon-btn svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

.progress-wrap{padding:8px 20px 12px;}
.segments{display:flex;gap:6px;height:5px;}
.segment{flex:1;background:var(--brand-border);border-radius:3px;transition:background .2s;}
.segment.filled{background:var(--brand);}
.progress-row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--text-muted);}

.card-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 20px 16px;min-height:0;}
.flashcard{width:100%;height:100%;max-height:420px;perspective:1000px;cursor:pointer;position:relative;}
.flashcard-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s ease;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;background:var(--surface);border:1px solid var(--brand-border);border-radius:var(--radius-card);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;overflow:auto;scrollbar-width:none;}
.card-face::-webkit-scrollbar{display:none;}
.card-back{background:var(--brand-soft);transform:rotateY(180deg);}
.card-tag{position:absolute;top:16px;left:16px;font-size:11px;font-weight:500;background:var(--brand-soft);color:var(--brand-dark);padding:3px 10px;border-radius:10px;}
.card-back .card-tag{background:rgba(255,255,255,.6);color:var(--brand-dark);}
.card-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px;}
.icon-btn-sm{width:32px;height:32px;border-radius:var(--radius-icon);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.icon-btn-sm:hover{transform:scale(.95);}
.icon-btn-sm.edit{background:var(--brand-soft);color:var(--brand);}
.icon-btn-sm.delete{background:var(--danger-soft);color:var(--danger);}
.icon-btn-sm svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.card-text{font-size:24px;font-weight:600;text-align:center;line-height:1.3;color:var(--text);padding:0 8px;word-break:break-word;}
.card-back .card-text{color:var(--brand-dark);}
.card-hint{position:absolute;bottom:16px;font-size:12px;color:var(--text-muted);}

.controls{display:flex;align-items:center;gap:8px;padding:8px 20px 12px;}
.btn-back{width:108px;height:48px;border-radius:var(--radius-btn);background:var(--surface);border:1px solid var(--brand-border);color:var(--brand);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s;}
.btn-back:hover{transform:scale(.97);}
.btn-show{flex:1;height:48px;border-radius:var(--radius-btn);background:var(--brand);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,background .2s;}
.btn-show:hover{transform:scale(.97);}
.btn-show.hide{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand);}
.btn-next{width:48px;height:48px;border-radius:var(--radius-btn);background:var(--surface);border:1px solid var(--brand-border);color:var(--brand);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.btn-next:hover{transform:scale(.97);}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn svg{width:18px;height:18px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

.bottom-bar{display:flex;align-items:center;justify-content:space-around;height:58px;background:var(--surface);border-top:1px solid var(--brand-border);}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--text-muted);padding:6px 12px;border-radius:8px;transition:.15s;}
.tab:hover{color:var(--brand);}
.tab.active{color:var(--brand);}
.tab svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

/* Bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;}
.backdrop.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:12px 20px 24px;z-index:11;transition:transform .3s ease;max-height:85vh;overflow-y:auto;}
.sheet.open{transform:translate(-50%,0);}
.handle{width:36px;height:4px;background:var(--brand-border);border-radius:2px;margin:0 auto 16px;}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:16px;color:var(--text);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:500;color:var(--brand-dark);margin-bottom:6px;}
.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--brand-border);border-radius:var(--radius-input);background:var(--bg);font-size:15px;resize:vertical;min-height:80px;outline:none;transition:.2s;}
.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,117,115,.15);}
.error{font-size:12px;color:var(--danger);margin-top:4px;display:flex;align-items:center;gap:4px;}
.sheet-actions{display:flex;gap:8px;margin-top:16px;}
.btn-ghost{flex:1;height:44px;border-radius:var(--radius-btn);background:var(--surface);border:1px solid var(--brand-border);color:var(--brand);font-weight:600;font-size:15px;}
.btn-primary{flex:2;height:44px;border-radius:var(--radius-btn);background:var(--brand);color:#fff;font-weight:600;font-size:15px;}

/* Delete modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:12;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;background:var(--surface);border-radius:16px;padding:24px;width:90%;max-width:320px;z-index:13;transition:.2s;}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);}
.modal h3{font-size:18px;font-weight:600;margin-bottom:8px;}
.modal .preview{font-size:14px;color:var(--text-muted);margin-bottom:16px;padding:10px;background:var(--bg);border-radius:10px;}
.modal-actions{display:flex;gap:8px;}
.btn-cancel{flex:1;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--brand-border);color:var(--text);font-weight:600;}
.btn-delete{flex:1;height:40px;border-radius:10px;background:var(--danger);color:#fff;font-weight:600;}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;}
.empty-state h2{font-size:20px;font-weight:600;margin-bottom:8px;}
.empty-state p{font-size:14px;color:var(--text-muted);margin-bottom:20px;}
.btn-add{height:44px;padding:0 24px;border-radius:var(--radius-btn);background:var(--brand);color:#fff;font-weight:600;font-size:15px;}

/* All cards view */
.allcards{position:fixed;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;}
.allcards.open{display:flex;}
.allcards header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--brand-border);}
.allcards header h2{font-size:20px;font-weight:600;}
.allcards .list{flex:1;overflow-y:auto;padding:12px 20px;}
.allcards .row{display:flex;align-items:center;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--brand-border);border-radius:12px;margin-bottom:8px;}
.allcards .row .q{flex:1;font-size:14px;font-weight:500;}
.allcards .row button{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.allcards .row .edit{background:var(--brand-soft);color:var(--brand);}
.allcards .row .del{background:var(--danger-soft);color:var(--danger);}

/* Toast */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:20;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){ .flashcard-inner{transition:none;} .flashcard.flipped .flashcard-inner{transform:none;} .card-back{display:none;} .flashcard.flipped .card-front{display:none;} .flashcard.flipped .card-back{display:flex;} }
@media (max-width:480px){ .app{border:none;border-radius:0;min-height:100dvh;} }
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="label">Deck</span>
      <span class="title">General knowledge</span>
    </div>
    <button class="icon-btn" id="stack-btn" aria-label="Cards list">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 6V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <div class="progress-wrap">
    <div class="segments" id="segments"></div>
    <div class="progress-row">
      <span id="card-counter">Card 1 of 4</span>
      <span id="progress-pct">0% done</span>
    </div>
  </div>

  <div class="card-stage" id="card-stage">
    <div class="empty-state" id="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M4 10h16"/></svg>
      <h2>Add your first card</h2>
      <p>Create a card to start studying.</p>
      <button class="btn-add" id="add-btn">Add card</button>
    </div>
    <div class="flashcard" id="flashcard">
      <div class="flashcard-inner">
        <div class="card-face card-front">
          <span class="card-tag">Question</span>
          <div class="card-actions">
            <button class="icon-btn-sm edit" id="edit-btn" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="icon-btn-sm delete" id="delete-btn" aria-label="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
          <div id="card-question" class="card-text"></div>
          <div class="card-hint">Tap the card to flip</div>
        </div>
        <div class="card-face card-back">
          <span class="card-tag">Answer</span>
          <div class="card-actions">
            <button class="icon-btn-sm edit" id="edit-btn2" aria-label="Edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="icon-btn-sm delete" id="delete-btn2" aria-label="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>
          </div>
          <div id="card-answer" class="card-text"></div>
          <div class="card-hint">Tap the card to flip</div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="prev-btn" class="btn-back" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
    <button id="show-answer-btn" class="btn-show">Show answer</button>
    <button id="next-btn" class="btn-next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>

  <div class="bottom-bar">
    <button class="tab active" data-tab="study"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Study</button>
    <button class="tab" id="all-cards-tab" data-tab="all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>All cards</button>
    <button class="tab" id="add-tab" data-tab="add"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add</button>
  </div>
</div>

<!-- Bottom sheet -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2 id="form-title">Add card</h2>
  <div class="field">
    <label for="question-input">Question</label>
    <textarea id="question-input" placeholder="Enter question"></textarea>
  </div>
  <div class="field">
    <label for="answer-input">Answer</label>
    <textarea id="answer-input" placeholder="Enter answer"></textarea>
  </div>
  <div id="error-message" class="error hidden"></div>
  <div class="sheet-actions">
    <button id="cancel-btn" class="btn-ghost">Cancel</button>
    <button id="save-btn" class="btn-primary">Save card</button>
  </div>
</div>

<!-- Delete modal -->
<div class="modal-backdrop" id="modal-backdrop"></div>
<div class="modal" id="delete-modal">
  <h3>Delete this card?</h3>
  <div class="preview" id="delete-preview"></div>
  <div class="modal-actions">
    <button class="btn-cancel" id="cancel-delete">Cancel</button>
    <button class="btn-delete" id="confirm-delete">Delete</button>
  </div>
</div>

<!-- All cards view -->
<div class="allcards" id="allcards-view">
  <header>
    <button class="icon-btn" id="close-allcards"><svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h2>All cards</h2>
  </header>
  <div class="list" id="allcards-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
