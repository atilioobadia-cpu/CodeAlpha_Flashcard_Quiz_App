<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcard Quiz App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Nunito', sans-serif; margin: 16px; color: #111827; background: #ebe9e9; }
  .app { max-width: 480px; margin: 0 auto; background: #fff; padding: 16px; border: 1px solid #dee2e6; }
  .card-area { border: 1px solid #dee2e6; padding: 16px; margin: 12px 0; min-height: 80px; }
  .form { border: 1px solid #dee2e6; padding: 12px; margin: 12px 0; }
  .form input, .form textarea { width: 100%; margin: 4px 0; padding: 6px; box-sizing: border-box; font-family: inherit; }
  .error { color: #dc3545; font-size: 13px; }
  .hidden { display: none; }
  button { margin: 4px; padding: 6px 10px; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { padding: 24px; text-align: center; border: 1px dashed #999; }
  .counter { font-size: 14px; color: #6c757d; margin: 8px 0; }
  .answer { margin-top: 8px; padding: 8px; background: #e6f1f1; }
  .list { margin-top: 12px; }
  .list-item { padding: 4px; border-bottom: 1px solid #eee; }
  .primary { background: #057573; color: #fff; border: none; }
</style>
</head>
<body>
<div class="app">
  <h1>Flashcards</h1>

  <div id="empty-state" data-testid="empty-state" class="empty hidden">
    <p>No cards yet.</p>
    <button id="add-btn-empty" data-testid="add-btn" onclick="openAdd()">Add Card</button>
  </div>

  <div id="study" data-testid="study" class="hidden">
    <div id="card-counter" data-testid="card-counter" class="counter">Card 0 of 0</div>
    <div class="card-area">
      <div id="card-question" data-testid="card-question"></div>
      <div id="card-answer" data-testid="card-answer" class="answer hidden"></div>
    </div>
    <div>
      <button id="show-answer-btn" data-testid="show-answer-btn" onclick="toggleAnswer()">Show Answer</button>
      <button id="prev-btn" data-testid="prev-btn" onclick="prevCard()">Previous</button>
      <button id="next-btn" data-testid="next-btn" onclick="nextCard()">Next</button>
      <button id="edit-btn" data-testid="edit-btn" onclick="openEdit()">Edit</button>
      <button id="delete-btn" data-testid="delete-btn" onclick="deleteCard()">Delete</button>
      <button id="add-btn" data-testid="add-btn" onclick="openAdd()">Add Card</button>
    </div>
  </div>

  <div id="form" data-testid="form" class="form hidden">
    <h3 id="form-title">Add Card</h3>
    <input id="question-input" data-testid="question-input" placeholder="Question" />
    <textarea id="answer-input" data-testid="answer-input" placeholder="Answer"></textarea>
    <div id="error-message" data-testid="error-message" class="error hidden"></div>
    <div>
      <button id="save-btn" data-testid="save-btn" class="primary" onclick="saveCard()">Save</button>
      <button id="cancel-btn" data-testid="cancel-btn" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <div id="list" data-testid="list" class="list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
